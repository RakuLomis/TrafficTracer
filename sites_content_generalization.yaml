sites:

  # Cross-content confirmatory target pool.
  #
  # Current-schema identity mapping:
  #   business_label = domain + "::" + traffic_type
  #   content_id     = page_type
  #   visit_id       = generated independently by TrafficTracer for every run
  #   deployment_id  = selected by the UI profile/node pipeline
  #
  # `traffic_type` values other than tcp/udp/all are intentionally normalized
  # to run_label with network=all. The preview warning stating that behavior is
  # expected and is not a configuration error.
  #
  # Capture protocol:
  # - Main confirmatory set: select targets 1-30 in the UI (indexes 0-29).
  # - Bilibili preflight: select targets 31-35 only (indexes 30-34).
  # - Configure repetition=5 and select only the SS and VLESS deployments for
  #   the confirmatory run. Rotate their order between repetitions.
  # - Use a fresh cold Chrome profile for every visit.
  # - Every target uses the same 60-second observation window. Downstream
  #   analysis should additionally compare a common post-navigation window.
  # - Query parameters are part of content identity and must be preserved.
  #
  # Bilibili is deliberately present as a separate candidate pool. The current
  # worker only emits deterministic playback confirmation for YouTube, so the
  # Bilibili preflight must separately audit primary playback, selected routing,
  # strict pairing coverage, and feature quality before formal collection.

  # ============================================================
  # A. youtube.com::video_playback (five contents)
  # ============================================================

  - domain: youtube.com
    url: "https://www.youtube.com/watch?v=sAWK0mgrMp4"
    wait: 60
    wait_load_timeout: 30
    traffic_type: video_playback
    page_type: yt-video-01
    playback:
      provider: youtube
      ad_policy: click_visible_skip
      desired_primary_seconds: 25

