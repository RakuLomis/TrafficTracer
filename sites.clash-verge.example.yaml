global:
  mihomo:
    # Clash Verge owns the process and supplies its controller socket.
    managed: false
    binary: /path/to/mihomo-traffictracer
    config: "/path/to/clash-verge.yaml"
    api: "unix:///tmp/verge/verge-mihomo.sock"
    # Leave empty to read the secret from the generated config above.
    secret: ""
  chrome:
    binary: google-chrome
    user_data_dir: /tmp/traffictracer-chrome
    headless: false
    enable_cdp: true
  network:
    tun_interface: Meta
    phys_interface: eth0
  output:
    base_dir: ./output
sites:
  - domain: example.com
    url: https://example.com
    wait: 10
    traffic_type: all
