global:
  mihomo:
    binary: ../mihomo-core/mihomo-traffictracer-v2
    config: mihomo-configs/config.yaml
    api: "http://127.0.0.1:9090"
    managed: false
  chrome:
    binary: google-chrome
    user_data_dir: chrome-profile
    headless: true
  network:
    tun_interface: utun
    phys_interface: wlp2s0
  output:
    base_dir: /data/datasets/ttTest

sites:
  # Existing baseline sites.
  - domain: bilibili.com
    url: "https://www.bilibili.com/"
    wait: 15
    traffic_type: all
    page_type: bilibili-main-page

  - domain: bilibili.com
    url: "https://www.bilibili.com/video/BV1hu4m1P7Mu/"
    wait: 15
    traffic_type: all
    page_type: bilibili-video-play-1

  - domain: bilibili.com
    url: "https://www.bilibili.com/video/BV1HEf2YWEvs/"
